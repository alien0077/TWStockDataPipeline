name: Publisher safety tests

on:
  pull_request:
    paths:
      - "scripts/publish_public.py"
      - "src/twstock_pipeline/**"
      - "tests/**"
      - ".github/workflows/publisher_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q scripts src tests
      - name: Assert no legacy Public_Data git mutation
        run: |
          ! grep -En 'git (clone|add|commit|push)|subprocess.*git' scripts/publish_public.py
