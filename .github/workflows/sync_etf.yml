name: Public ETF sync
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 2-5'
concurrency: {group: public-etf, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/catchup.py
