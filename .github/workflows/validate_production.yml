name: Validate public production collectors (shadow)
on:
  workflow_dispatch:
concurrency: {group: public-shadow-validation, cancel-in-progress: false}
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Run independent public domains
        shell: bash
        run: |
          mkdir -p artifacts/shadow artifacts/reports
          for domain in calendar market institutional margin etf fx tdcc revenue financial corporate_actions; do
            started=$(date +%s)
            set +e
            python scripts/sync_public.py "$domain" --data-root artifacts/shadow >"artifacts/reports/$domain.log" 2>&1
            code=$?
            set -e
            ended=$(date +%s)
            printf '{"domain":"%s","status":"%s","duration_seconds":%s}\n' "$domain" "$([ "$code" -eq 0 ] && echo PASS || echo BLOCKED)" "$((ended-started))" >"artifacts/reports/$domain.json"
          done
      - name: Generate health and compatibility report
        if: always()
        run: |
          python scripts/build_shadow_health.py --data-root artifacts/shadow --output artifacts/shadow/data_health.json
          git clone --depth 1 https://github.com/alien0077/Public_Data.git artifacts/legacy
          python scripts/compare_public_data.py --old-root artifacts/legacy/data --shadow-root artifacts/shadow --output artifacts/compatibility_report.json
      - name: Generate compact hosted ETF evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = list(Path('artifacts/shadow').rglob('latest_snapshot.json'))
          p = candidates[0] if candidates else Path('artifacts/shadow/quant/etf/outputs/latest_snapshot.json')
          payload = json.loads(p.read_text()) if p.exists() else {}
          rows = payload.get('etfs') if isinstance(payload, dict) and 'etfs' in payload else (payload.get('data') if isinstance(payload, dict) and 'data' in payload else payload)
          if isinstance(rows, list):
              rows = {str(x.get('symbol') or x.get('code') or ''): x for x in rows if isinstance(x, dict)}
          symbols = sorted(rows)
          legacy_candidates = list(Path('artifacts/legacy').rglob('latest_snapshot.json'))
          legacy_path = legacy_candidates[0] if legacy_candidates else Path('artifacts/legacy/data/quant/etf/outputs/latest_snapshot.json')
          legacy_payload = json.loads(legacy_path.read_text()) if legacy_path.exists() else {}
          legacy_rows = legacy_payload.get('etfs') if isinstance(legacy_payload, dict) and 'etfs' in legacy_payload else (legacy_payload.get('data') if isinstance(legacy_payload, dict) and 'data' in legacy_payload else legacy_payload)
          if isinstance(legacy_rows, list):
              legacy_rows = {str(x.get('symbol') or x.get('code') or ''): x for x in legacy_rows if isinstance(x, dict)}
          legacy = set(legacy_rows)
          current = set(symbols)
          out = {
              'collector_commit': '${{ github.sha }}',
              'runner': 'ubuntu-latest',
              'snapshot_path': str(p),
              'snapshot_exists': p.exists(),
              'snapshot_keys': sorted(payload) if isinstance(payload, dict) else [],
              'etf_count': len(current),
              'contains_00793B': '00793B' in current,
              'legacy_count': len(legacy),
              'intersection_count': len(legacy & current),
              'legacy_only': sorted(legacy - current),
              'current_only': sorted(current - legacy),
              'known_active_missing': sorted(legacy - current)
          }
          Path('artifacts/reports/hosted_etf_validation.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          PY
          rm -rf artifacts/legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twstock-shadow-output
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-etf-evidence
          path: artifacts/reports/hosted_etf_validation.json
          if-no-files-found: error
