name: Public reference sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'
concurrency: {group: public-reference, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/sync_public.py calendar
      - run: python scripts/sync_public.py tdcc
